<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="마크다운으로 쓰는 개인 블로그">
  <meta name="color-scheme" content="light dark">
  <title>My Blog</title>
  <script>
    // 깜빡임 방지: CSS보다 먼저 테마를 결정한다.
    (function () {
      var theme = null;
      try { theme = localStorage.getItem('theme'); } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#app">본문으로 건너뛰기</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="site-title" href="#/">My Blog</a>
      <div class="header-actions">
        <a class="write-link" href="#/game">2048</a>
        <a class="write-link" href="#/write" hidden>글쓰기</a>
        <button class="theme-toggle" type="button" aria-label="다크 모드" aria-pressed="false">
          <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
          </svg>
          <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4.5"/>
            <path d="M12 1.5v2.5M12 20v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M1.5 12H4M20 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main id="app" class="container" tabindex="-1">
    <p class="status">불러오는 중…</p>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 My Blog</p>
    </div>
  </footer>
</body>
</html>
